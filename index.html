<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AEROLITE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050814">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#050814;--pn:#0b0f22;--tx:#eaeaf6;--mu:#8a8fb0;--ln:#1f2347;--ac:#8A2BE2;--ac2:#3b82f6;--glow:rgba(138,43,226,.35);--er:#f87171;--kb:0px;--fs:15px;--mono:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:var(--kb)}
.screen{display:none;flex:1;flex-direction:column;min-height:0}.screen.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sq{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ac);background:linear-gradient(135deg,rgba(138,43,226,.35),rgba(10,14,34,.9));font-size:20px;padding:0}
.seg{display:flex;flex:1;max-width:190px;padding:4px;border-radius:24px;border:1px solid var(--ln);background:var(--pn);margin:0 auto}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;border-radius:20px;font-size:16px}
.seg button.on{background:linear-gradient(135deg,var(--ac),#4c1d95);color:#fff;font-weight:600}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--ac2);background:var(--bg);font-size:18px;padding:0;box-shadow:0 0 14px var(--ac2)}
.ol{padding:10px 16px;border-radius:14px;border:1.5px solid var(--ac);background:var(--bg);font-weight:600}
.bl{border-color:var(--ac2)}.bl.on{background:var(--ac2);color:#fff}
.ed{flex:1;display:flex;min-height:0;margin:0 6px 6px;border-radius:16px;border:1.5px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;box-shadow:0 0 22px var(--glow);overflow:hidden}
#gut{width:38px;flex:none;box-sizing:border-box;padding:12px 6px 12px 0;text-align:right;color:var(--mu);border-right:1px solid var(--ln);font-size:var(--fs);line-height:1.6;font-family:var(--mono);white-space:pre;overflow:hidden}
#code{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;padding:12px;white-space:pre;overflow:auto;font-size:var(--fs);line-height:1.6;font-family:var(--mono)}
.sym{display:none;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--ln);background:var(--pn)}
.typing .sym{display:flex}
.k{flex:none;min-width:42px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-family:var(--mono)}
#area{flex:1;position:relative;margin:0 12px 8px;border:2px solid var(--ac2);border-radius:20px;background:#03050f;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 0 18px rgba(59,130,246,.25)}
.oh{padding:16px 12px 8px;border-bottom:1px solid var(--ln);margin:0 12px;font-family:var(--mono)}.oh span{color:#22d3ee}
#out{flex:1;overflow:auto;padding:12px 18px;white-space:pre-wrap;font-size:var(--fs);line-height:1.6;font-family:var(--mono)}
#out.hide{visibility:hidden}.er{color:var(--er)}.mu{color:var(--mu)}
.inrow{display:flex;gap:10px;padding:0 12px 10px}
#ans{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ac);background:var(--bg)}
#ans:disabled,.inrow .ol:disabled{opacity:.45}
.fl{position:absolute;right:14px;width:54px;height:54px;border-radius:50%;border:2px solid var(--ac);background:var(--pn);color:var(--ac);font-size:12px;touch-action:none;z-index:3;padding:0}
.dragging .fl{border-style:dashed}.fl.sel{background:var(--ac);color:#fff}
.scroll{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{padding:14px;border-radius:18px;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(138,43,226,.14),var(--pn));display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px;color:#d8c4ff}.card h4{margin:6px 0 0;font-size:15px}
.hdr{flex-direction:row;align-items:center;gap:12px}
.card label{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c8b4ff}
.card input,.card select,#sRules{padding:9px 12px;border-radius:12px;border:1.5px solid var(--ac);background:var(--bg);min-width:0}
.card input{width:130px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{flex-direction:column;align-items:stretch;gap:4px}.grid input{width:auto}
#sRules{width:100%;box-sizing:border-box;min-height:130px;font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre;overflow:auto}
.ap{display:flex;gap:14px;align-items:center}
#wheel{width:150px;height:150px;flex:none;border-radius:50%;touch-action:none;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);-webkit-mask:radial-gradient(circle,transparent 52%,#000 53%);mask:radial-gradient(circle,transparent 52%,#000 53%)}
.hexrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}.hexrow input{width:100%}#hexdot{width:22px;height:22px;border-radius:6px;flex:none}
#sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#sw button{aspect-ratio:1;border-radius:10px;border:2px solid transparent;padding:0}#sw button.sel{border-color:#fff}
#pre{display:flex;flex-wrap:wrap;gap:8px}.pre{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;border:1px solid var(--ln);background:var(--bg);font-size:13px}.pre i{width:12px;height:12px;border-radius:50%}
#smsg{min-height:1.4em}
.two{display:flex;gap:12px}.two button{flex:1;padding:14px;border-radius:30px;font-weight:600;border:1.5px solid var(--ac);background:var(--bg)}
.two .solid{border:0;background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff}
.box h3{margin:0;color:#d8c4ff}
#sheet{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.6);z-index:20;box-sizing:border-box;padding-bottom:var(--kb)}
#sheet.on{display:flex}
.box{width:100%;box-sizing:border-box;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;border-top:1.5px solid var(--ac);background:var(--pn);display:flex;flex-direction:column;gap:10px}
.box label{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c8b4ff}
.box input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ac);background:var(--bg)}
.box button{padding:13px;border-radius:14px;border:1.5px solid var(--ac);background:var(--bg);font-weight:600}
.box .solid{border:0;background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff}
.lt{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.card input[type=range]{width:100%;height:28px;padding:0;border:0;-webkit-appearance:none;appearance:none;border-radius:14px;background:linear-gradient(90deg,#000,var(--pk,var(--ac)),#fff)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--ac2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ac2)}
.swt{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c8b4ff}
.card input[type=checkbox]{-webkit-appearance:none;appearance:none;width:52px;height:30px;padding:0;border-radius:15px;border:1.5px solid var(--ln);background:var(--bg);position:relative;flex:none}
.card input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:transform .15s}
.card input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.card input[type=checkbox]:checked::after{transform:translateX(22px);background:#fff}
</style></head>
<body>
<div id="app">
<section id="s1" class="screen on">
 <header class="bar">
  <button class="sq" id="bSet" aria-label="Settings">&#9881;&#xFE0E;</button>
  <div class="seg"><button data-n="1" class="on">1</button><button data-n="2">2</button></div>
  <button class="play" id="bRun" aria-label="Run">&#9654;&#xFE0E;</button>
  <button class="ol" id="bSave">Save</button>
 </header>
 <div class="ed"><div id="gut"></div><textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off">opt="hello AEROLITE"
ipt(all)="Type something"
opt="You typed: " + x</textarea></div>
 <div class="sym" id="sym"></div>
</section>
<section id="s2" class="screen">
 <header class="bar">
  <button class="ol" id="bBack">&lt; Back</button>
  <div class="seg"><button data-n="1">1</button><button data-n="2" class="on">2</button></div>
  <button class="ol bl" id="bDrag">Drag</button>
 </header>
 <div id="area"><div class="oh"><span>&gt;_</span> Output</div><div id="out"></div></div>
 <div class="inrow"><input id="ans" disabled autocomplete="off" autocapitalize="off" placeholder="Type here when asked"><button class="ol" id="send" disabled>Send</button></div>
</section>
<section id="s3" class="screen">
 <div class="scroll">
  <div class="card hdr"><button class="sq" id="sBack" aria-label="Back">&#8249;</button><div><b>AEROLITE</b><div class="mu">Compiler Settings</div></div></div>
  <div class="card"><h3>General Settings</h3><div class="mu">Customize your compiler experience</div>
   <label>Font Style<select id="fsel"></select></label>
   <label>Text Size<span><button class="ol" id="fm">A-</button> <button class="ol" id="fp">A+</button></span></label></div>
  <div class="card"><h3>Your Commands (Rules)</h3><div class="mu">Define your own commands</div>
   <textarea id="sRules" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>
  <div class="card"><h3>Appearance Options</h3><div class="mu">Personalize the look</div>
   <label class="swt">Change app color<input type="checkbox" id="live" aria-label="Change app color"></label>
   <div class="mu" id="livehint"></div>
   <div class="ap"><div id="wheel"></div><div style="flex:1;min-width:0"><div class="hexrow"><i id="hexdot"></i><input id="hex" aria-label="Hex code"></div><div id="sw"></div></div></div>
   <label class="lt">Brightness (darker to lighter)<input type="range" id="lit" min="15" max="85" step="1" aria-label="Brightness"></label>
   <h4>Theme Presets</h4><div id="pre"></div></div>
  <div id="smsg" class="er"></div>
  <div class="two"><button id="sReset">Reset</button><button class="solid" id="sSave">Save</button></div>
 </div>
</section>
</div>
<div id="sheet"><div class="box">
 <h3>Save code</h3>
 <label>File name<input id="fname" value="program.aero" autocapitalize="off" autocomplete="off"></label>
 <button class="solid" id="oDl">Save to phone (Downloads)</button>
 <button id="oSh">Share or choose where to save</button>
 <button id="oApp">Keep inside the app</button>
 <div id="fmsg" class="mu"></div>
 <button id="oClose">Close</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const DEF={out:"opt",inp:"ipt inp",assign:"=",join:"+",comment:"#",fs:15,ac:"#8A2BE2",ac2:"#3b82f6",font:"JetBrains Mono",live:true,rules:"rule set {new} to {value} => {new} = {value}\nrule add {value} to {var} => {var} = add({var}, {value})\nrule wait {number} => await wait({number})\nrule stop => stop()"};
let S={...DEF};
try{Object.assign(S,JSON.parse(localStorage.getItem("aero2")||"{}"))}catch(e){}
const store=()=>{try{localStorage.setItem("aero2",JSON.stringify(S))}catch(e){}};
const words=s=>s.split(/[\s,]+/).filter(Boolean);
const FONTS={"JetBrains Mono":"'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace","Fira Code":"'Fira Code',ui-monospace,Menlo,Consolas,monospace","Courier":"'Courier New',Courier,monospace","System Mono":"ui-monospace,Menlo,Consolas,monospace"};
function rgba(h,a){const n=parseInt(h.slice(1),16);return "rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
function apply(){
 const r=document.documentElement.style;
 r.setProperty("--ac",S.ac);r.setProperty("--ac2",S.ac2);r.setProperty("--glow",rgba(S.ac,.35));
 r.setProperty("--fs",S.fs+"px");r.setProperty("--mono",FONTS[S.font]||FONTS["System Mono"]);
 const keys=['"',S.assign,S.join,"(",")",words(S.out)[0],words(S.inp)[0],"all","int","float","alpha"];
 $("sym").innerHTML="";
 keys.forEach(t=>{const b=document.createElement("button");b.className="k";b.textContent=t;
  b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>{const c=$("code");c.setRangeText(t,c.selectionStart,c.selectionEnd,"end");c.focus();gut();keep()};
  $("sym").appendChild(b)});
}
function show(n){
 for(let i=1;i<=3;i++)$("s"+i).classList.toggle("on",i===n);
 document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",+b.dataset.n===n));
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>show(+b.dataset.n));
$("bBack").onclick=$("sBack").onclick=()=>show(1);
function gut(){const c=$("code");$("gut").textContent=c.value.split("\n").map((_,i)=>i+1).join("\n");$("gut").scrollTop=c.scrollTop}
function keep(){try{localStorage.setItem("aero2code",$("code").value)}catch(e){}}
function kb(){const v=window.visualViewport;const h=v?Math.max(0,Math.round(window.innerHeight-v.height-v.offsetTop)):0;document.documentElement.style.setProperty("--kb",h+"px")}
function fname(){let n=($("fname").value.trim()||"program").replace(/[\\\/:*?"<>|]/g,"_");if(!/\.aero$/i.test(n))n+=".aero";return n}
function fmsg(t){$("fmsg").textContent=t}
function openSave(){keep();$("sheet").classList.add("on");fmsg("")}
$("oClose").onclick=()=>$("sheet").classList.remove("on");
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").classList.remove("on")});
$("oApp").onclick=()=>{keep();fmsg("Saved inside the app")};
$("oDl").onclick=()=>{
 const n=fname(),a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([$("code").value],{type:"application/octet-stream"}));a.download=n;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
 fmsg("Saved "+n+" to your Downloads folder");
};
$("oSh").onclick=async()=>{
 const f=new File([$("code").value],fname(),{type:"text/plain"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name})}catch(e){}}
 else fmsg("Sharing is not available here. Use Save to phone.");
};
function init(){
 try{const c=localStorage.getItem("aero2code");if(c!==null)$("code").value=c}catch(e){}
 apply();gut();kb();
 $("code").addEventListener("input",()=>{gut();keep()});
 $("code").addEventListener("scroll",()=>{$("gut").scrollTop=$("code").scrollTop});
 $("code").addEventListener("focus",()=>$("app").classList.add("typing"));
 $("code").addEventListener("blur",()=>$("app").classList.remove("typing"));
 if(window.visualViewport){visualViewport.addEventListener("resize",kb);visualViewport.addEventListener("scroll",kb)}
 $("bSave").onclick=openSave;
}

/* ---- compiler ---- */
const TY={
 int:[/^[+-]?\d+$/,s=>parseInt(s,10),"enter a whole number"],
 float:[/^[+-]?(\d+\.?\d*|\.\d+)$/,s=>parseFloat(s),"enter a number"],
 alpha:[/^\p{L}+( +\p{L}+)*$/u,s=>s,"enter letters only"],
 all:[/^.*$/,s=>/^[+-]?\d+$/.test(s)?parseInt(s,10):/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):s,""]};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const sym=s=>/^\w+$/.test(s)?"(?<!\\w)"+esc(s)+"(?!\\w)":esc(s);
function stripC(l){let q=false;for(let i=0;i<l.length;i++){if(l[i]==='"')q=!q;else if(!q&&l.startsWith(S.comment,i))return l.slice(0,i)}return l}
function lex(t,fail){
 const re=new RegExp(`(?<S>"[^"\\n]*")|(?<A>${sym(S.assign)})|(?<J>${sym(S.join)})|(?<F>-?\\d+\\.\\d+)|(?<I>-?\\d+)|(?<N>[A-Za-z_]\\w*)|(?<L>\\()|(?<R>\\))|(?<W>\\s+)|(?<B>.)`,"g");
 const tk=[];
 for(const m of t.matchAll(re)){
  const k=Object.keys(m.groups).find(g=>m.groups[g]!==undefined);
  if(k==="W")continue;
  if(k==="B")fail(m[0]==='"'?"missing closing quote":"unexpected character "+m[0]);
  tk.push([k,m[0]]);
 }
 return tk;
}
function parse(src){
 const outW=words(S.out),inW=words(S.inp),defined=new Set(),stmts=[];
 const lines=src.replace(/[\u201C\u201D]/g,'"').split("\n");
 for(let n=0;n<lines.length;n++){
  const fail=m=>{throw new Error("line "+(n+1)+": "+m)};
  const tk=lex(stripC(lines[n]),fail);
  if(!tk.length)continue;
  const expr=a=>{
   const terms=[];let want=true;
   for(const [k,v] of a){
    if(want){
     if(k==="S")terms.push({s:v.slice(1,-1)});
     else if(k==="I"||k==="F")terms.push({n:+v});
     else if(k==="N"){if(!defined.has(v))fail(v+" has no value yet (use "+inW[0]+" first)");terms.push({v})}
     else fail("unexpected "+v);
     want=false;
    }else{if(k!=="J")fail("use "+S.join+" to join items");want=true}
   }
   if(want)fail("missing a value after "+S.join);
   return terms;
  };
  if(tk[0][0]==="N"&&outW.includes(tk[0][1])){
   if(tk.length<3||tk[1][0]!=="A")fail("output looks like:  "+tk[0][1]+" "+S.assign+' "hello"');
   stmts.push({k:"o",t:expr(tk.slice(2))});continue;
  }
  let tg="x",i=0;
  if(tk.length>1&&tk[0][0]==="N"&&tk[1][0]==="A"){tg=tk[0][1];i=2}
  const r=tk.slice(i);
  if(r.length&&r[0][0]==="N"&&inW.includes(r[0][1])){
   if(r.map(t=>t[0]).join("")!=="NLNRAS")fail("input looks like:  "+inW[0]+"(all) "+S.assign+' "type something"');
   if(outW.includes(tg)||inW.includes(tg)||TY[tg])fail(tg+" is a reserved word, choose another name");
   if(!TY[r[2][1]])fail("unknown type "+r[2][1]+" (use int, float, alpha, all)");
   stmts.push({k:"i",tg,ty:r[2][1],p:r[5][1].slice(1,-1)});defined.add(tg);continue;
  }
  let hit=false;
  for(const r of RULES){
   const b=match(r.t,tk);if(!b)continue;
   const m={},nw=[];
   for(const [l,[k,x]] of Object.entries(b)){
    if(k==="value")m[l]=gen(expr(x));
    else if(k==="text")m[l]=JSON.stringify(x[1].slice(1,-1));
    else if(k==="number")m[l]=String(+x[1]);
    else{
     const nm=x[1];
     if(k==="var"&&!defined.has(nm))fail(nm+" has no value yet");
     if(k==="new"){if(outW.includes(nm)||inW.includes(nm)||TY[nm])fail(nm+" is a reserved word, choose another name");nw.push(nm)}
     m[l]="V["+JSON.stringify(nm)+"]";
    }
   }
   stmts.push({k:"r",c:r.c.replace(/\{([A-Za-z_]\w*)\}/g,(a,l)=>l in m?m[l]:a)});
   nw.forEach(z=>defined.add(z));hit=true;break;
  }
  if(hit)continue;
  fail("I do not understand this line. Commands start with: "+[...outW,...inW,...RULES.map(r=>r.t[0][1])].join(", "));
 }
 return stmts;
}
let runId=0;
function pr(t,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=t;$("out").appendChild(d);$("out").scrollTop=1e9}
function ask(p,ty){
 return new Promise(res=>{
  const [re,cv,msg]=TY[ty],inp=$("ans");
  pr(p,"mu");inp.disabled=false;$("send").disabled=false;inp.value="";inp.focus();
  const go=()=>{
   const t=inp.value.trim();
   if(!re.test(t)){pr("  "+msg,"er");inp.value="";return}
   inp.disabled=true;$("send").disabled=true;pr("> "+t);res(cv(t));
  };
  $("send").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
 });
}
async function run(){
 show(2);const id=++runId;$("out").textContent="";$("ans").disabled=true;$("send").disabled=true;
 let st;try{st=parse($("code").value)}catch(e){pr(e.message,"er");return}
 const V={};
 for(const s of st){
  if(id!==runId)return;
  if(s.k==="o")pr(String(s.t.map(t=>"s"in t?t.s:"n"in t?t.n:V[t.v]).reduce((a,b)=>typeof a==="number"&&typeof b==="number"?a+b:String(a)+String(b))));
  else if(s.k==="r"){
   try{await RF(s.c)(V,t=>pr(String(t)),add,wait,stop)}catch(e){if(e instanceof Stop)return pr("Stopped","mu");pr(e.message,"er");return}
   if(id!==runId)return;
  }
  else{const v=await ask(s.p,s.ty);if(id!==runId)return;V[s.tg]=v}
 }
 pr("Done","mu");
}
$("bRun").onclick=run;

/* ---- settings ---- */
const SW=["#ef4444","#f87171","#f97316","#f59e0b","#fde68a","#22c55e","#10b981","#2dd4bf","#2563eb","#38bdf8","#8A2BE2","#a855f7","#ec4899","#f1f5f9","#6b7280"];
const PRE={"Neon Purple":["#8A2BE2","#3b82f6"],"Matrix Green":["#22c55e","#14b8a6"],"Ocean Blue":["#0ea5e9","#6366f1"],"Sunset":["#f59e0b","#ef4444"]};
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
function h2l(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let hh=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh=(hh*60+360)%360}return [hh,s*100,l*100]}
function paint(){
 const on=S.live!==false;
 document.documentElement.style.setProperty("--pk",P.ac);
 $("hex").value=P.ac;$("hexdot").style.background=P.ac;
 if(document.activeElement!==$("lit"))$("lit").value=Math.round(h2l(P.ac)[2]);
 $("sw").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.c.toLowerCase()===P.ac.toLowerCase()));
 $("live").checked=on;
 $("livehint").textContent=on?"On: the app changes to the color you pick.":"Off: the app color stays as it is. Colors you pick are only previewed here.";
}
let P={ac:S.ac,ac2:S.ac2};
function setAc(c,c2){P.ac=c;if(c2)P.ac2=c2;if(S.live!==false){S.ac=P.ac;S.ac2=P.ac2;store();apply()}paint()}
function setLive(on){S.live=on;if(on){S.ac=P.ac;S.ac2=P.ac2;apply()}store();paint()}
SW.forEach(c=>{const b=document.createElement("button");b.dataset.c=c;b.style.background=c;b.setAttribute("aria-label","Color "+c);b.onclick=()=>setAc(c);$("sw").appendChild(b)});
Object.entries(PRE).forEach(([n,[a,b2]])=>{const b=document.createElement("button");b.className="pre";b.innerHTML='<i style="background:'+a+'"></i>'+n;b.onclick=()=>setAc(a,b2);$("pre").appendChild(b)});
Object.keys(FONTS).forEach(n=>{const o=document.createElement("option");o.textContent=n;$("fsel").appendChild(o)});
$("fsel").onchange=()=>{S.font=$("fsel").value;store();apply()};
$("hex").onchange=()=>{const v=$("hex").value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v))setAc(v);else paint()};
const wheel=$("wheel");
function pick(e){const r=wheel.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;setAc(hsl((Math.atan2(y,x)*180/Math.PI+450)%360,85,+$("lit").value))}
$("lit").oninput=()=>{const c=h2l(P.ac);setAc(hsl(c[0],c[1],+$("lit").value))};
$("live").onchange=()=>setLive($("live").checked);
wheel.addEventListener("pointerdown",e=>{wheel.setPointerCapture(e.pointerId);pick(e)});
wheel.addEventListener("pointermove",e=>{if(e.buttons)pick(e)});
function fill(){$("sRules").value=S.rules;$("fsel").value=S.font;$("smsg").textContent="";paint()}
$("bSet").onclick=()=>{fill();show(3)};
$("fm").onclick=()=>{S.fs=Math.max(11,S.fs-1);store();apply()};
$("fp").onclick=()=>{S.fs=Math.min(28,S.fs+1);store();apply()};
$("sSave").onclick=()=>{
 const snap={...S};S.rules=$("sRules").value;
 const er=reload();if(er){S=snap;reload();return $("smsg").textContent=er}
 store();apply();show(1);
};
$("sReset").onclick=()=>{S={...DEF};P={ac:S.ac,ac2:S.ac2};store();apply();reload();fill()};

/* ---- drag mode: tap Drag, then touch an icon and move it ---- */
let dm=false,sel=null,mv=false;
$("bDrag").onclick=()=>{
 dm=!dm;$("bDrag").classList.toggle("on",dm);$("area").classList.toggle("dragging",dm);
 if(!dm&&sel){sel.classList.remove("sel");sel=null}
};
function place(el,x,y){
 const a=$("area").getBoundingClientRect();
 el.style.right=el.style.bottom="auto";
 el.style.left=Math.max(0,Math.min(a.width-el.offsetWidth,x-a.left-el.offsetWidth/2))+"px";
 el.style.top=Math.max(0,Math.min(a.height-el.offsetHeight,y-a.top-el.offsetHeight/2))+"px";
}
document.querySelectorAll(".fl").forEach(el=>{
 el.addEventListener("pointerdown",e=>{
  if(!dm)return;e.preventDefault();
  if(sel)sel.classList.remove("sel");
  sel=el;el.classList.add("sel");mv=true;el.setPointerCapture(e.pointerId);
 });
 el.addEventListener("pointermove",e=>{if(dm&&mv&&sel===el)place(el,e.clientX,e.clientY)});
 el.addEventListener("pointerup",()=>{mv=false});
 el.addEventListener("click",e=>{if(dm){e.stopPropagation();return}el.onact&&el.onact()});
});
$("area").addEventListener("click",e=>{if(dm&&sel&&!e.target.closest(".fl,#askrow"))place(sel,e.clientX,e.clientY)});

/* ---- rules: your own commands, edited in Settings ---- */
const AF=Object.getPrototypeOf(async function(){}).constructor;
const add=(a,b)=>typeof a==="number"&&typeof b==="number"?a+b:String(a)+String(b);
const wait=s=>new Promise(r=>setTimeout(r,s*1000));
class Stop extends Error{}
const stop=()=>{throw new Stop()};
const RF=c=>new AF("V","print","add","wait","stop",c);
const HK=["value","text","number","var","new"];
const hk=l=>HK.find(k=>l.startsWith(k));
let RULES=[];
function gen(terms){return terms.map(t=>"s"in t?JSON.stringify(t.s):"n"in t?String(t.n):"V["+JSON.stringify(t.v)+"]").reduce((a,b)=>"add("+a+","+b+")")}
function match(rt,tk){
 const b={};let i=0;
 for(let p=0;p<rt.length;p++){
  const q=rt[p];
  if(q[0]!=="H"){if(!tk[i]||tk[i][0]!==q[0]||tk[i][1]!==q[1])return null;i++;continue}
  const k=hk(q[1]);
  if(k==="value"){
   let j=i+1;
   if(p+1<rt.length){const s=rt[p+1];while(j<tk.length&&!(tk[j][0]===s[0]&&tk[j][1]===s[1]))j++;if(j>=tk.length)return null}
   else j=tk.length;
   if(j<=i)return null;
   b[q[1]]=[k,tk.slice(i,j)];i=j;
  }else{
   const t=tk[i];if(!t)return null;
   const ok=k==="text"?t[0]==="S":k==="number"?(t[0]==="I"||t[0]==="F"):t[0]==="N";
   if(!ok)return null;
   b[q[1]]=[k,t];i++;
  }
 }
 return i===tk.length?b:null;
}
function loadRules(){
 const rs=[],used=[...words(S.out),...words(S.inp),...Object.keys(TY)];
 S.rules.split("\n").forEach((ln,n)=>{
  ln=ln.trim();if(!ln||ln[0]==="#")return;
  const fail=m=>{throw new Error("rule line "+(n+1)+": "+m)};
  const mm=ln.match(/^rule\s+(.*?)=>(.*)$/);
  if(!mm)fail("a rule looks like:  rule say {value} => print({value})");
  const toks=[];
  mm[1].trim().split(/(\{[^{}]*\})/).forEach(p=>{
   if(!p)return;
   if(/^\{.*\}$/.test(p)){
    const l=p.slice(1,-1);
    if(!/^[A-Za-z_]\w*$/.test(l)||!hk(l))fail("the hole "+p+" must start with value, text, number, var or new");
    if(toks.some(t=>t[0]==="H"&&t[1]===l))fail("the hole "+p+" is used twice");
    toks.push(["H",l]);
   }else toks.push(...lex(p,fail));
  });
  if(!toks.length||toks[0][0]!=="N")fail("a rule must start with a word");
  if(used.includes(toks[0][1]))fail(toks[0][1]+" is already used by the language, choose another first word");
  for(let j=0;j<toks.length-1;j++)if(toks[j][0]==="H"&&hk(toks[j][1])==="value"&&toks[j+1][0]==="H")fail("put a word or symbol between two holes");
  const d={};
  toks.forEach(t=>{if(t[0]==="H")d[t[1]]=hk(t[1])==="text"?'"t"':/^(var|new)/.test(t[1])?'V["t"]':"1"});
  const code=mm[2].trim();
  for(const z of code.matchAll(/\{([A-Za-z_]\w*)\}/g))if(!(z[1] in d))fail("the code uses {"+z[1]+"} but the pattern has no {"+z[1]+"}");
  try{RF(code.replace(/\{([A-Za-z_]\w*)\}/g,(a,l)=>l in d?d[l]:a))}catch(e){fail("the code has a mistake ("+e.message+")")}
  rs.push({t:toks,c:code});
 });
 return rs;
}
function reload(){try{RULES=loadRules();return ""}catch(e){RULES=[];return e.message}}
reload();

init();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
